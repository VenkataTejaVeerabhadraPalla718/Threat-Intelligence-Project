name: SENTINEL-X CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: "pip"}
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m compileall -q backend labs
      - run: pytest -q
